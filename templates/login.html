<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>HiveXchange</title>
</head>

<body>

    <h1>HiveXchange</h1>

    <form action="/login" method="POST">

        <input
            type="text"
            name="username"
            placeholder="Email or username"
            required
        >

        <br><br>

        <input
            type="password"
            name="password"
            placeholder="Password"
            required
        >

        <br><br>

        <button type="submit">
            Sign In
        </button>

    </form>

    {% if error %}
        <p>{{ error }}</p>
    {% endif %}

</body>

</html>
